services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_secret
      POSTGRES_DB: gateway_db
      # Password of the least-privilege runtime role (deploy/postgres/initdb).
      GATEWAY_RUNTIME_PASSWORD: ${GATEWAY_RUNTIME_PASSWORD:-gateway_runtime_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway_app
    env_file: .env
    environment:
      # Runtime: least-privilege role. Migrations: table owner.
      DATABASE_URL: postgres://gateway_runtime:${GATEWAY_RUNTIME_PASSWORD:-gateway_runtime_secret}@postgres:5432/gateway_db?sslmode=disable
      MIGRATIONS_DATABASE_URL: postgres://gateway:gateway_secret@postgres:5432/gateway_db?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
